# IM 服务端配置模板
# 复制为 config.yaml 后填入真实值；config.yaml 已被 gitignore，真实凭证不要提交到代码库。
server:
  name: im-service
  http_addr: ":8080"
  mode: debug

mysql:
  dsn: "用户名:密码@tcp(127.0.0.1:3306)/im?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 3600
  migrate_dir: ../../migrations

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  pool_size: 20
  dial_timeout: 5
  read_timeout: 3
  write_timeout: 3

oss:
  endpoint: "oss-cn-xxx.aliyuncs.com"
  access_key_id: "<你的AccessKeyID>"
  access_key_secret: "<你的AccessKeySecret>"
  bucket: "<你的bucket>"
  region: "cn-xxx"
  presign_expire_sec: 600

jwt:
  secret: "<随机生成的JWT密钥>"
  access_expire: 7200      # 2 小时
  refresh_expire: 2592000    # 30 天
  issuer: im-service

log:
  level: debug
  output: stdout

gateway:
  heartbeat_interval: 30
  write_wait: 10
  pong_wait: 60
